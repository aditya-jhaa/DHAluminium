<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — DH Aluminium</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #C9A84C;
      --gold-light: #E2C97E;
      --black: #F5F0E8;
      --dark: #EDE8DF;
      --dark2: #E4DDD2;
      --white: #1A1208;
      --grey: #6B6459;
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Jost', sans-serif;
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo { margin-bottom: 2.5rem; }
    .logo img { height: 80px; width: auto; }
    .gold-line { width: 50px; height: 2px; background: var(--gold); margin: 0 auto 2rem; }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 300;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      color: var(--white);
    }
    h1 em { font-style: italic; color: var(--gold); }
    p {
      font-size: 1rem;
      color: var(--grey);
      max-width: 480px;
      line-height: 1.9;
      margin: 0 auto 2.5rem;
    }
    .btn-gold {
      background: var(--gold);
      color: #1A1208;
      padding: 0.85rem 2.2rem;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s, transform 0.2s;
      border-radius: 2px;
    }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); }
    .checkmark {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(201,168,76,0.12);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 1.8rem;
    }
  </style>

</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W3X82F67"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="logo">
    <img src="images/logo.png" alt="DH Aluminium Logo"/>
  </div>
  <div class="checkmark">✓</div>
  <p class="eyebrow">Message Received</p>
  <div class="gold-line"></div>
  <h1>Thank You for <em>Reaching Out</em></h1>
  <p>We've received your message and will get back to you within 24 hours. In the meantime, feel free to browse our products or give us a call.</p>
  <a href="https://dhaluminium.com.au" class="btn-gold">Back to Website</a>
</body>
</html>
